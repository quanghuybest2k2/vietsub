# Offline Vietnamese Subtitle Configuration

audio:
  sample_rate: 16000
  chunk_size: 1024
  channels: 1
  device_index: null
  noise_reduction: true # 300 Hz high-pass before measuring the level
  volume_threshold: 0.002 # absolute minimum RMS treated as speech (~-54 dBFS)
  noise_ratio: 3.0 # speech = this many times louder than the tracked room noise
  silence_timeout: 2.0 # seconds of silence that end an utterance

whisper:
  model_size: "base" # tiny | base | small | medium | large (large-v3) | turbo (large-v3-turbo)
  language: "auto" # real-time mode only; file modes use --language (default: en)
  device: "auto" # auto = GPU when it works (verified at load), otherwise CPU | cuda | cpu
  compute_type: "auto" # auto = best type the device supports:
  #   NVIDIA Volta/Turing/Ampere+ -> float16, Pascal (GTX 10xx, Quadro Pxxx) -> int8, CPU -> int8
  cpu_threads: 4 # CPU threads (base model: 4 is as fast as 8; larger models benefit from more)
  beam_size: 1 # --video. 5 got names right more often but gave longer, coarser-timed
  #   cues on the sample videos and is ~1.5x slower; try it for name-heavy content
  export_beam_size: 1 # --export-srt / --voiceover (speed mode)
  realtime_beam_size: 1 # microphone mode
  best_of: 1
  temperature: 0.0 # one value = no temperature fallback (fast, stable).
  #   A list such as [0.0, 0.2, 0.4] re-decodes failed windows (slower; can add noise)
  # vad_parameters: {min_silence_duration_ms: 2000}

translation:
  target_language: "vi"
  backend: "auto" # auto = CTranslate2 (fastest) -> Transformers -> opus-mt -> Argos
  ct2_model_dir: "models/nllb-200-distilled-600M-ct2-int8" # created once from facebook/nllb-200-distilled-600M
  auto_convert: true # one-time conversion (needs PyTorch + ~3 GB free RAM, writes ~620 MB)
  device: "auto" # auto | cuda | cpu
  compute_type: "auto" # GPU: int8_float16 / float16 / int8 (whatever is supported), CPU: int8
  cpu_threads: 4
  beam_size: 4 # 4 = best quality; 2 is ~1.7x faster (-1.3 chrF on JA->VI); 1 = greedy
  batch_size: 32 # sentences per model call (sorted by length internally)

# Subtitle (SRT) building
srt:
  merge_fragments: true # join a segment cut mid-sentence with the next one before translating
  max_merge_gap: 0.8 # seconds of pause allowed between the two parts
  max_cue_seconds: 6.0 # merged subtitle must stay on screen at most this long
  max_cue_chars: 84 # ~2 lines of 42 characters (half for Chinese/Japanese/Korean)

# Anti-repetition settings (prevents Whisper hallucination in long videos)
anti_repetition:
  condition_on_previous_text: false # false = more stable for long videos
  repetition_penalty: 1.0 # 1.0 = off. 1.2 penalised legitimately repeated words
  #   ("say" -> "see", "done" -> "down" on videos/english.mp4); raise only for looping audio
  no_speech_threshold: 0.5 # higher = skip more noise (0.0-1.0)
  compression_ratio_threshold: 2.0 # only used when temperature is a list (fallback enabled)
  segment_similarity_threshold: 0.85 # similarity ratio to detect duplicates
  max_allowed_repetitions: 2 # max consecutive repetitions allowed

# Subtitle burn-in (--video) and voiceover fallback encoding
video:
  encoder: "auto" # auto = h264_nvenc when it works on this GPU/driver, else libx264
  preset: "veryfast" # libx264 preset; "medium" is ~1.4x slower for a barely visible gain
  nvenc_preset: "p5"
  crf: 23 # quality: lower = better/larger (used as -cq for NVENC)

tts:
  temperature: 1.0
  # Temperature for TTS generation (0.0-1.5).
  # Higher = more expressive but may have artifacts.
  # Lower = more stable/consistent.
  # Recommended: 0.8-1.0 for v3 Turbo
  batch_size: 32 # GPU batch size for VieNeu (lower it on GPUs with little VRAM)

subtitles:
  font_family: "Arial"
  font_size: 24
  font_color: [255, 255, 255]
  background_color: [0, 0, 0]
  background_opacity: 0.7
  position: "bottom"
  margin: 50
  max_width: 0.8
  display_duration: 5.0
  fade_duration: 0.5
  max_chars_per_line: 50
  max_lines: 2
  text_align: "center"

performance:
  translation_workers: 1 # real-time mode async workers (model inference is serialized)
  max_cache_size: 1000

logging:
  level: "INFO"
  file_output: true
  console_output: true
  max_file_size: "10MB"
  backup_count: 3
